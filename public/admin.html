<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>商品管理｜盼享随充</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#6b7280;--line:#e7ebf2;--brand:#e65f50;--brand-dark:#d94d40;--green:#159a69;--nav:#172033}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.side{position:sticky;top:0;width:230px;height:100vh;background:var(--nav);color:#d9e0ec;padding:24px 16px}.brand{display:flex;align-items:center;gap:10px;color:#fff;font-size:19px;font-weight:750;padding:8px 12px 34px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#f58270,#d84d48);display:grid;place-items:center;color:#fff;box-shadow:0 7px 20px #e65f5040}.nav-title{font-size:12px;color:#8190a8;margin:18px 12px 8px}.nav a{display:block;color:#bac6d8;text-decoration:none;padding:12px;border-radius:10px;margin:3px 0;font-size:14px}.nav a.active,.nav a:hover{background:#26344d;color:#fff}.main{flex:1;min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 38px}.crumb b{font-size:18px;margin-right:14px}.crumb{color:var(--muted);font-size:14px}.user{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.avatar{width:32px;height:32px;border-radius:50%;background:#ffe4df;color:var(--brand);display:grid;place-items:center;font-weight:700}.logout{border:0;background:transparent;color:#7c8797;padding:7px}.logout:hover{color:var(--brand)}.content{padding:32px 38px;max-width:1500px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px}.hero h1{margin:0 0 8px;font-size:27px}.hero p{margin:0;color:var(--muted);font-size:14px}.actions{display:flex;gap:10px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 15px;color:var(--ink);transition:.18s}.btn:hover{border-color:#cbd4e2}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-dark)}.btn:disabled{opacity:.55;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:19px 20px;box-shadow:0 5px 20px #17203308}.stat .label{font-size:13px;color:var(--muted)}.stat .value{font-size:27px;font-weight:750;margin-top:9px}.stat .hint{font-size:12px;color:var(--muted);margin-top:5px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 8px 30px #17203308}.toolbar{display:flex;gap:12px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}.search{position:relative;flex:1;min-width:220px}.search input{width:100%;padding:11px 13px 11px 36px;border:1px solid var(--line);border-radius:9px;outline:none}.search input:focus,.select:focus,.price-input:focus,.desc-input:focus{border-color:#ed9185;box-shadow:0 0 0 3px #e65f5012;outline:none}.search span{position:absolute;left:13px;top:10px;color:#9aa4b2}.select{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}.notice{font-size:13px;color:var(--muted);padding:14px 20px;background:#fffaf8}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th{text-align:left;font-size:12px;color:#7a8595;background:#fafbfc;padding:13px 16px;border-bottom:1px solid var(--line)}td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}.sku{font-weight:700;color:#25324a}.sub{font-size:12px;color:var(--muted);margin-top:4px}.price-input,.desc-input{border:1px solid var(--line);border-radius:7px;padding:8px 9px;width:120px}.desc-input{width:230px}.switch{position:relative;width:39px;height:22px;display:inline-block}.switch input{display:none}.slider{position:absolute;inset:0;background:#cbd2dc;border-radius:20px}.slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.18s}.switch input:checked+.slider{background:var(--green)}.switch input:checked+.slider:before{transform:translateX(17px)}.empty{padding:55px;text-align:center;color:var(--muted)}.toast{position:fixed;right:28px;bottom:28px;background:#172033;color:#fff;padding:13px 17px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:9}.toast.show{opacity:1;transform:none}
    @media(max-width:900px){.side{display:none}.top{padding:0 18px}.content{padding:24px 16px}.cards{grid-template-columns:repeat(2,1fr)}.hero{align-items:flex-start;gap:15px;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}}
    @media(max-width:520px){.cards{grid-template-columns:1fr}.crumb{font-size:0}.crumb b{font-size:17px}.content{padding-top:20px}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand"><div class="logo">P</div>盼享随充</div>
      <div class="nav-title">运营中心</div>
      <nav class="nav"><a class="active" href="/admin.html">▦　商品管理</a><a href="/">⌂　充值页面</a><a href="#">↗　订单中心</a></nav>
      <div class="nav-title">系统</div>
      <nav class="nav"><a href="#">⚙　系统设置</a></nav>
    </aside>
    <main class="main">
      <header class="top">
        <div class="crumb"><b>商品管理</b> / ReloadN SKU</div>
        <div class="user"><span id="adminName">管理员</span><span class="avatar">管</span><button class="logout" id="logout" title="退出登录">退出</button></div>
      </header>
      <section class="content">
        <div class="hero">
          <div><h1>充值套餐</h1><p>同步供应商商品，设置描述、售价与上架状态。</p></div>
          <div class="actions"><button class="btn" id="fx">↻　刷新汇率</button><button class="btn primary" id="sync">⇩　同步 ReloadN SKU</button></div>
        </div>
        <div class="cards">
          <div class="stat"><div class="label">商品总数</div><div class="value" id="total">—</div><div class="hint">供应商返回的 SKU</div></div>
          <div class="stat"><div class="label">已上架</div><div class="value" id="published">—</div><div class="hint">正在展示给用户</div></div>
          <div class="stat"><div class="label">当前汇率</div><div class="value" id="rate">—</div><div class="hint">IDR / CNY</div></div>
          <div class="stat"><div class="label">最近更新</div><div class="value" id="synced">—</div><div class="hint" id="syncHint">尚未更新</div></div>
        </div>
        <div class="panel">
          <div class="toolbar">
            <div class="search"><span>⌕</span><input id="search" placeholder="搜索 SKU、商品名称或运营商"></div>
            <select id="status" class="select"><option value="all">全部状态</option><option value="published">已上架</option><option value="hidden">未上架</option></select>
            <select id="operator" class="select"><option value="all">全部运营商</option></select>
          </div>
          <div class="notice">自动定价公式：（买入价 IDR − 120）÷ 当前 IDR/CNY 汇率；选择“手动定价”可覆盖自动价格。</div>
          <div class="table-wrap"><table><thead><tr><th>SKU / 运营商</th><th>供应商买入价</th><th>商品描述</th><th>价格模式</th><th>售价（CNY）</th><th>上架</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="7"><div class="empty">正在加载商品…</div></td></tr></tbody></table></div>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    let csrfToken="",all=[];
    const $=selector=>document.querySelector(selector),rows=$("#rows"),toast=$("#toast");
    function notify(message){toast.textContent=message;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2600)}
    function esc(value){return String(value??"").replace(/[&<>"']/g,character=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character]))}
    async function call(url,options={}){
      const method=String(options.method||"GET").toUpperCase(),headers={...(options.headers||{})};
      if(options.body)headers["Content-Type"]="application/json";
      if(!["GET","HEAD"].includes(method))headers["X-CSRF-Token"]=csrfToken;
      const response=await fetch(url,{...options,credentials:"same-origin",headers});
      let data={};try{data=await response.json()}catch{}
      if(response.status===401){location.replace("/admin-login.html");throw Error("登录状态已失效")}
      if(!response.ok)throw Error(data.message||"请求失败");
      return data;
    }
    function render(){
      const query=$("#search").value.trim().toLowerCase(),status=$("#status").value,operator=$("#operator").value;
      const list=all.filter(product=>(!query||`${product.sku} ${product.name} ${product.operator}`.toLowerCase().includes(query))&&(status==="all"||(status==="published"?product.published:!product.published))&&(operator==="all"||product.operator===operator));
      $("#total").textContent=all.length;$("#published").textContent=all.filter(product=>product.published).length;
      rows.innerHTML=list.length?list.map(product=>`<tr data-sku="${esc(product.sku)}"><td><div class="sku">${esc(product.sku)}</div><div class="sub">${esc(product.operator||"未知运营商")} · ${esc(product.kind||"")}</div></td><td><b>${product.buyPriceIdr==null?"—":Number(product.buyPriceIdr).toLocaleString()}</b><div class="sub">IDR</div></td><td><input class="desc-input" maxlength="500" value="${esc(product.description||product.name||"")}"></td><td><select class="mode select"><option value="auto" ${product.priceMode!=="manual"?"selected":""}>自动定价</option><option value="manual" ${product.priceMode==="manual"?"selected":""}>手动定价</option></select></td><td><input class="price-input" type="number" min="0" step="0.01" value="${product.priceCny??""}"></td><td><label class="switch"><input class="pub" type="checkbox" ${product.published?"checked":""}><span class="slider"></span></label></td><td><button class="btn save">保存</button></td></tr>`).join(""):`<tr><td colspan="7"><div class="empty">暂无匹配商品，请同步 ReloadN SKU 或调整筛选条件。</div></td></tr>`;
      document.querySelectorAll(".save").forEach(button=>button.onclick=save);
    }
    async function save(event){
      const button=event.currentTarget,row=button.closest("tr");button.disabled=true;
      try{await call(`/api/admin/products/${encodeURIComponent(row.dataset.sku)}`,{method:"PUT",body:JSON.stringify({description:row.querySelector(".desc-input").value,priceMode:row.querySelector(".mode").value,priceCny:Number(row.querySelector(".price-input").value),published:row.querySelector(".pub").checked})});notify("商品设置已保存");await load()}
      catch(error){notify(error.message)}finally{button.disabled=false}
    }
    async function load(){
      const data=await call("/api/admin/products");all=data.products||[];
      const operators=[...new Set(all.map(product=>product.operator).filter(Boolean))];
      $("#operator").innerHTML='<option value="all">全部运营商</option>'+operators.map(operator=>`<option>${esc(operator)}</option>`).join("");render();
      try{const fx=await call("/api/admin/fx");if(fx.fx){$("#rate").textContent=Number(fx.fx.idrPerCny).toLocaleString();$("#synced").textContent=new Date(fx.fx.updatedAt).toLocaleDateString();$("#syncHint").textContent=new Date(fx.fx.updatedAt).toLocaleString()}}catch{}
    }
    async function action(button,task,message){button.disabled=true;try{await task();notify(message);await load()}catch(error){notify(error.message)}finally{button.disabled=false}}
    $("#sync").onclick=()=>action($("#sync"),()=>call("/api/admin/products/sync",{method:"POST"}),"SKU 同步完成");
    $("#fx").onclick=()=>action($("#fx"),()=>call("/api/admin/fx/refresh",{method:"POST"}),"汇率已刷新");
    ["#search","#status","#operator"].forEach(selector=>$(selector).addEventListener("input",render));
    $("#logout").onclick=async()=>{try{await call("/api/admin/logout",{method:"POST"})}finally{location.replace("/admin-login.html")}};
    (async()=>{try{const session=await call("/api/admin/session");csrfToken=session.csrfToken;$("#adminName").textContent=session.user||"管理员";await load()}catch(error){if(!String(error.message).includes("登录状态"))notify(error.message)}})();
  </script>
</body>
</html>
